<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elementa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@700;900&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 위에는 어두운 연성 작업대(재료 + 재료 = 결과)가 붙어 있고, 아래에는 분류 선반과 원소 타일 격자, 오른쪽에 발견 기록 */
:root {
  --bg: #E7EBEE;
  --paper: #F7F9FA;
  --ink: #141C26;
  --muted: #5A6774;
  --line: #C9D1D8;
  --dot: #C4CCD3;
  --accent: #2A4FD6;
  --on-accent: #FFFFFF;
  --bench: #18212D;
  --bench-ink: #EEF2F6;
  --bench-muted: #9AA7B5;
  --bench-line: #33404F;
  --bench-slot: #212C3A;
  --gold: #E3A72B;
  --bad: #C8432F;
  --c-base: #E0602F;
  --c-earth: #9A6B3F;
  --c-sky: #2E8FC9;
  --c-life: #3E9B54;
  --c-human: #D2557A;
  --c-civ: #C8901E;
  --c-tech: #7656D6;
  --c-food: #148F77;
  --c-myth: #A23BB8;
  --f-display: "Hahmlet", "Noto Serif KR", "AppleMyungjo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
  --f-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D131B; --paper: #151D28; --ink: #E6EBF1; --muted: #8F9CAB; --line: #263242; --dot: #1C2633;
    --accent: #86A2FF; --on-accent: #0D131B;
    --bench: #1A2433; --bench-ink: #EEF2F6; --bench-muted: #9AA7B5; --bench-line: #33415A; --bench-slot: #222E40;
    --gold: #F1BD4B; --bad: #F2806B;
    --c-base: #F2875B; --c-earth: #C79A6E; --c-sky: #5DB4E8; --c-life: #6CC482; --c-human: #EC85A4; --c-civ: #E7B54C; --c-tech: #A48BF0; --c-food: #3DD6BC; --c-myth: #D28BE6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D131B; --paper: #151D28; --ink: #E6EBF1; --muted: #8F9CAB; --line: #263242; --dot: #1C2633;
  --accent: #86A2FF; --on-accent: #0D131B;
  --bench: #1A2433; --bench-ink: #EEF2F6; --bench-muted: #9AA7B5; --bench-line: #33415A; --bench-slot: #222E40;
  --gold: #F1BD4B; --bad: #F2806B;
  --c-base: #F2875B; --c-earth: #C79A6E; --c-sky: #5DB4E8; --c-life: #6CC482; --c-human: #EC85A4; --c-civ: #E7B54C; --c-tech: #A48BF0; --c-food: #3DD6BC; --c-myth: #D28BE6;
  color-scheme: dark;
}

[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1px, transparent 1.3px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap {
  max-width: 1140px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
  display: flex; flex-direction: column; gap: 20px;
}

/* 머리글 */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; }
.eyebrow {
  margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .14em; color: var(--muted);
}
h1 {
  margin: 0; font-family: var(--f-display); font-weight: 900;
  font-size: clamp(34px, 6vw, 56px); line-height: 1; letter-spacing: -.02em; text-wrap: balance;
}
h1 em { font-style: normal; color: var(--accent); }
.progress { min-width: 0; flex: 0 1 300px; display: flex; flex-direction: column; gap: 8px; }
.progress-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.count { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 28px; line-height: 1; white-space: nowrap; }
.count small { font-size: 15px; color: var(--muted); }
.progress-label { font-size: 13px; color: var(--muted); white-space: nowrap; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .5s ease; }
.top-right { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; flex: 0 1 380px; min-width: 0; }
.top-right .progress { min-width: 180px; }
.top-right .progress { flex: 1 1 auto; }
.sound-btn {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  border-radius: 99px; padding: 6px 12px 6px 10px; font-size: 13px; font-weight: 500; cursor: pointer;
}
.sound-btn svg { width: 18px; height: 18px; }
.sound-btn[aria-pressed="false"] { color: var(--muted); }
.sound-btn .wave { transition: opacity .15s ease; }
.sound-btn[aria-pressed="false"] .wave { opacity: 0; }
.sound-btn .mute { opacity: 0; transition: opacity .15s ease; }
.sound-btn[aria-pressed="false"] .mute { opacity: 1; }

/* 작업대 */
.bench {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bench); color: var(--bench-ink);
  border-radius: 22px; padding: 20px clamp(16px, 3vw, 28px);
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 16px 28px;
  box-shadow: 0 0 0 8px var(--bg), 0 18px 40px -24px #0008;
}
.bench-title { font-family: var(--f-display); font-weight: 700; font-size: 18px; margin: 0; white-space: nowrap; }
.bench-title span { display: block; font-family: var(--f-body); font-weight: 500; font-size: 12px; color: var(--bench-muted); letter-spacing: .08em; }
.mix { display: flex; align-items: center; justify-content: center; gap: clamp(8px, 2vw, 18px); min-width: 0; }
.op { font-family: var(--f-display); font-size: 26px; color: var(--bench-muted); }
.slot {
  width: clamp(76px, 12vw, 104px); aspect-ratio: 1; max-width: 100%;
  border-radius: 18px; border: 1.5px dashed var(--bench-line); background: var(--bench-slot);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  padding: 6px; cursor: pointer; transition: transform .15s ease, border-color .15s ease;
}
button.slot:hover { border-color: var(--bench-muted); }
.slot.filled { border-style: solid; border-color: var(--bench-line); }
.slot .emo { font-family: var(--f-emoji); font-size: clamp(30px, 5vw, 42px); line-height: 1.1; }
.slot .nm { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.slot .ph { font-size: 12px; color: var(--bench-muted); }
.slot.result { cursor: default; border-color: color-mix(in oklab, var(--gold) 55%, var(--bench-line)); }
.slot.result.new { border: 2px solid var(--gold); box-shadow: 0 0 0 6px color-mix(in oklab, var(--gold) 22%, transparent), 0 0 34px color-mix(in oklab, var(--gold) 45%, transparent); animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
.slot.result.known { border-style: solid; }
.slot.result.fail { border-style: solid; border-color: color-mix(in oklab, var(--bad) 70%, var(--bench-line)); }
.slot.result.fail .emo { color: var(--bad); font-family: var(--f-display); }
.bench-side { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.btn {
  border: 1px solid var(--bench-line); background: transparent; color: var(--bench-ink);
  border-radius: 12px; padding: 8px 14px; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--bench-slot); }
.btn.gold { border-color: var(--gold); color: var(--gold); }
.msg { grid-column: 1 / -1; margin: 0; font-size: 14px; color: var(--bench-muted); text-align: center; min-height: 1.55em; word-break: keep-all; overflow-wrap: anywhere; text-wrap: balance; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.msg b { color: var(--bench-ink); font-weight: 600; }
.msg.good b { color: var(--gold); }
.shake .mix { animation: shake .4s ease; }

/* 본문 */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
.shelf { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.shelf-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab {
  border: 1px solid var(--line); background: var(--paper); border-radius: 99px;
  padding: 5px 12px; font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.tab .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tab .sw { width: 8px; height: 8px; border-radius: 50%; background: var(--cat, var(--muted)); }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab[aria-pressed="true"] .n { color: var(--bg); opacity: .7; }
.tab:disabled { opacity: .45; cursor: not-allowed; }
.tab .fresh { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
.toggle input { accent-color: var(--accent); }

.group { display: flex; flex-direction: column; gap: 10px; }
.group + .group { margin-top: 10px; }
.group-h { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink); letter-spacing: .06em; }
.group-h .sw { width: 9px; height: 9px; border-radius: 50%; background: var(--cat); flex: none; }
.group-h .n { font-family: var(--f-mono); font-weight: 500; color: var(--muted); }
.group-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 10px; }
.tile {
  position: relative; border: 1px solid var(--line); background: var(--paper); border-radius: 16px;
  padding: 12px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer;
  transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
}
.tile:hover { transform: translateY(-2px); border-color: color-mix(in oklab, var(--cat) 60%, var(--line)); box-shadow: 0 8px 18px -12px color-mix(in oklab, var(--cat) 70%, transparent); }
.tile .orb {
  width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
  background: color-mix(in oklab, var(--cat) 16%, transparent);
}
.tile .emo { font-family: var(--f-emoji); font-size: 30px; line-height: 1; }
.tile .nm { font-size: 13px; font-weight: 500; line-height: 1.25; text-align: center; word-break: keep-all; overflow-wrap: anywhere; max-width: 100%; }
.tile.picked { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.tile.done { background: transparent; }
.tile.done .orb { opacity: .45; filter: grayscale(.5); }
.tile.done .nm { color: var(--muted); }
.tile.done .check { position: absolute; top: 6px; right: 8px; font-size: 11px; color: var(--muted); }
.tile .dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 3px color-mix(in oklab, var(--gold) 25%, transparent); }
.tile.hinted { animation: hint 1.1s ease-in-out 3; border-color: var(--gold); }
.empty { color: var(--muted); font-size: 14px; padding: 24px 0; }

.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.panel h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.log li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 13px; color: var(--muted); }
.log li b { color: var(--ink); font-weight: 600; }
.log .e { font-family: var(--f-emoji); }
.log .arrow { color: var(--muted); }
.cats { display: flex; flex-direction: column; gap: 9px; }
.cat-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 52px; align-items: center; gap: 10px; font-size: 13px; }
.cat-row .n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); font-size: 12px; }
.cat-row .bar { height: 6px; }
.cat-row .bar > i { background: var(--cat); }
.foot { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.link-btn { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 12px; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; }
.confirm button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.confirm .danger { border-color: var(--bad); color: var(--bad); }

/* 발견 연출 */
.reveal {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in oklab, var(--bench) 70%, transparent); backdrop-filter: blur(4px);
}
.reveal-card {
  position: relative; width: min(380px, 100%); background: var(--bench); color: var(--bench-ink);
  border: 1px solid var(--bench-line); border-radius: 26px; padding: 34px 26px 24px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 8px; overflow: hidden;
  animation: rise .45s cubic-bezier(.2,1.3,.4,1);
}
.reveal-card::before {
  content: ""; position: absolute; top: -90px; left: 50%; width: 320px; height: 320px; margin-left: -160px; border-radius: 50%;
  background: repeating-conic-gradient(color-mix(in oklab, var(--gold) 26%, transparent) 0 9deg, transparent 9deg 22deg);
  animation: spin 14s linear infinite; pointer-events: none;
}
.r-orb {
  position: relative; width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 6px;
  background: radial-gradient(circle, color-mix(in oklab, var(--gold) 38%, var(--bench)) 0%, var(--bench) 70%);
  box-shadow: 0 0 0 2px var(--gold), 0 0 40px color-mix(in oklab, var(--gold) 50%, transparent);
}
.r-orb .emo { font-family: var(--f-emoji); font-size: 58px; line-height: 1; }
.r-eyebrow { position: relative; margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .14em; color: var(--gold); }
.r-name { position: relative; margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 34px; line-height: 1.1; }
.r-recipe { position: relative; margin: 0; font-size: 14px; color: var(--bench-muted); }
.r-desc { position: relative; margin: 4px 0 8px; font-size: 15px; max-width: 30ch; text-wrap: balance; }
.r-extra { position: relative; margin: 0 0 6px; font-size: 13px; color: var(--gold); }
.r-ok { position: relative; border: 0; border-radius: 14px; background: var(--gold); color: var(--bench); font-weight: 600; padding: 11px 22px; cursor: pointer; font-size: 15px; }

@keyframes pop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
@keyframes rise { 0% { transform: translateY(24px) scale(.94); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shake { 0%,100% { transform: none; } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
@keyframes hint { 0%,100% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--gold) 0%, transparent); } 50% { box-shadow: 0 0 0 6px color-mix(in oklab, var(--gold) 40%, transparent); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.search {
  border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  border-radius: 99px; padding: 6px 12px; font: inherit; font-size: 14px; width: 150px; min-width: 0;
}
.search::placeholder { color: var(--muted); }

/* 업적 */
.panel h2 .n { font-family: var(--f-mono); font-weight: 500; font-size: 13px; color: var(--muted); margin-left: 6px; }
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 8px; }
.ach {
  position: relative; aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--line); background: var(--bg);
  display: grid; place-items: center; padding: 0; cursor: pointer; transition: transform .12s ease;
}
.ach .emo { font-family: var(--f-emoji); font-size: 22px; line-height: 1; }
.ach:hover { transform: translateY(-2px); }
.ach.on { background: color-mix(in oklab, var(--gold) 18%, var(--paper)); border-color: var(--gold); }
.ach:not(.on) .emo { opacity: .35; filter: grayscale(1); }
.ach[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
.ach-detail { margin: 0; font-size: 13px; color: var(--muted); min-height: 2.6em; }
.ach-detail b { color: var(--ink); }
.ach-detail .on { color: var(--gold); font-weight: 600; }

/* 업적 알림 */
.toast {
  position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); z-index: 30;
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  background: var(--bench); color: var(--bench-ink); border: 1px solid var(--gold); border-radius: 16px;
  padding: 10px 18px 10px 14px; display: flex; align-items: center; gap: 12px; max-width: min(92vw, 420px);
  box-shadow: 0 12px 30px -12px #0009, 0 0 0 4px color-mix(in oklab, var(--gold) 20%, transparent);
  transition: transform .3s cubic-bezier(.2,1.3,.4,1), opacity .3s ease;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }
.toast .emo { font-family: var(--f-emoji); font-size: 28px; line-height: 1; }
.toast b { display: block; font-size: 11px; letter-spacing: .12em; color: var(--gold); font-weight: 600; }
.toast span { font-size: 14px; font-weight: 500; }

/* 가로로 눕힌 휴대폰처럼 낮은 화면 */
@media (max-height: 520px) {
  .bench { position: static; }
  .reveal { place-items: safe center; overflow-y: auto; }
  .reveal-card { padding: 20px 22px 18px; gap: 4px; }
  .r-orb { width: 72px; height: 72px; margin-bottom: 2px; }
  .r-orb .emo { font-size: 38px; }
  .r-name { font-size: 26px; }
  .r-desc { margin: 2px 0 6px; font-size: 14px; }
}

@media (max-width: 880px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .wrap { padding-block: 18px 40px; gap: 16px; }
  .search { width: 100%; }
  .bench { grid-template-columns: minmax(0, 1fr); padding: 14px 12px 12px; gap: 10px; border-radius: 18px; }
  .bench-title { display: none; }
  .bench-side { flex-direction: row; justify-content: center; }
  .op { font-size: 20px; }
  .slot { width: 76px; border-radius: 14px; }
  .slot .nm { font-size: 12px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 8px; }
  .tile { padding: 10px 4px 8px; border-radius: 14px; }
  .tile .orb { width: 44px; height: 44px; }
  .tile .emo { font-size: 26px; }
  .tile .nm { font-size: 12px; }
}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">불 · 물 · 흙 · 공기에서 시작하는 창조</p>
      <h1>Element<em>a</em></h1>
    </div>
    <div class="top-right">

        setMsg("새로운 발견! <b>" + esc(josa(r, "이", "가")) + "</b> 탄생하고 " + CATS[EL[r].cat] + " 분류가 열렸어요.", true);
      } else {
        setMsg("새로운 발견! <b>" + esc(josa(r, "이", "가")) + "</b> 탄생했어요.", true);
      }
      if (showCards || newCat || ending) showReveal(a, b, r, newCat);
    }
    checkAch(false);
    if (result.type === "new") {
      render();
    } else {
      // 실패·아는 조합은 선반 내용이 안 바뀌므로 작업대와 선택 표시만 손본다.
      renderBench();
      patchTiles();
      renderAch();
    }
    save();
  }

  function removeSlot(i) {
    if (!sel[i] && !result) return;
    sfx("clear");
    result = null;
    sel[i] = null;
    if (!sel[0] && sel[1]) { sel = [sel[1], null]; }
    setMsg(sel[0] ? pickMsg() : "원소 두 개를 차례로 눌러 섞어보세요.");
    render();
  }

  function clearBench() {
    if (sel[0] || result) sfx("clear");
    sel = [null, null];
    result = null;
    setMsg("작업대를 비웠어요. 원소 두 개를 차례로 눌러 섞어보세요.");
    render();
  }

  function scrollToTile(n) {
    var t = els.shelf.querySelector('.tile[data-n="' + n + '"]');
    if (!t) return;
    var rect = t.getBoundingClientRect();
    var top = 0;
    if (getComputedStyle(els.bench).position === "sticky") top = Math.max(0, els.bench.getBoundingClientRect().bottom);
    var dy = 0;
    if (rect.top < top + 12) dy = rect.top - top - 16;
    else if (rect.bottom > window.innerHeight - 12) dy = rect.bottom - window.innerHeight + 16;
    if (dy) window.scrollBy({ top: dy, behavior: reduceMotion() ? "auto" : "smooth" });
  }

  function giveHint() {
    if (hint && isFound(hint.r)) hint = null;
    if (!hint) {
      var cands = RECIPE_LIST.filter(function (x) { return isFound(x.a) && isFound(x.b) && !isFound(x.r); });
      if (!cands.length) { setMsg("더 찾을 조합이 없어요. 모든 원소를 발견했어요!", true); return; }
      var c = cands[Math.floor(Math.random() * cands.length)];
      hint = { a: c.a, b: c.b, r: c.r, stage: 0 };
    }
    if (hint.stage < 2) { hint.stage++; hints++; }
    sfx("hint");
    if (hint.stage === 1) {
      setMsg("힌트: <b>" + esc(josa(hint.a, "을", "를")) + "</b> 무언가와 섞어보세요. 한 번 더 누르면 짝도 알려드려요.", true);
      flashHint = [hint.a];
    } else {
      setMsg("힌트: <b>" + esc(hint.a) + "</b> + <b>" + esc(hint.b) + "</b>", true);
      flashHint = [hint.a, hint.b];
    }
    if (tab !== "all" && flashHint.some(function (n) { return EL[n].cat !== tab; })) tab = "all";
    render();
    save();
    scrollToTile(hint.a);
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () {
      flashHint = [];
      Array.prototype.forEach.call(els.shelf.querySelectorAll(".tile.hinted"), function (t) { t.classList.remove("hinted"); });
    }, 3400);
  }

  var lastFocusKey = null, revealAt = 0;
  function setInert(on) {
    els.wrap.inert = on;
    if (on) els.wrap.setAttribute("inert", ""); else els.wrap.removeAttribute("inert");
  }
  function showReveal(a, b, r, newCat) {
    var e = EL[r];
    $("rEmo").textContent = e.emoji;
    $("rName").textContent = r;
    $("rRecipe").textContent = EL[a].emoji + " " + a + "  +  " + EL[b].emoji + " " + b;
    $("rDesc").textContent = e.desc;
    $("rEyebrow").textContent = newCat ? "새 분류 열림 · " + CATS[e.cat] : "새로운 발견 · " + CATS[e.cat];
    var extra = $("rExtra");
    if (allFound()) {
      extra.textContent = "모든 원소를 발견했어요. 세상이 완성되었습니다!";
      extra.hidden = false;
    } else if (r === FINAL) {
      extra.textContent = "가장 먼 발명에 도달했어요. 남은 원소 " + (TOTAL - found.length) + "개도 찾아보세요.";
      extra.hidden = false;
    } else {
      extra.hidden = true;
    }
    lastFocusKey = focusKey();
    revealAt = Date.now();
    els.reveal.hidden = false;
    els.reveal.scrollTop = 0;
    setInert(true);
    $("rOk").focus();
  }
  function closeReveal() {
    if (els.reveal.hidden) return;
    // 빠른 연타나 엔터 길게 누르기로 카드가 바로 닫히지 않게 잠깐 기다린다.
    if (Date.now() - revealAt < 500) return;
    els.reveal.hidden = true;
    setInert(false);
    restoreFocus(lastFocusKey);
  }

  function hideConfirm() {
    els.resetConfirm.hidden = true;
    els.resetBtn.focus();
  }

  /* ---------- 이벤트 ---------- */
  els.shelf.addEventListener("click", function (ev) {
    var t = ev.target.closest(".tile");
    if (t) pick(t.getAttribute("data-n"));
  });
  els.tabs.addEventListener("click", function (ev) {
    var t = ev.target.closest(".tab");
    if (!t || t.disabled) return;
    tab = t.getAttribute("data-tab");
    sfx("tab");
    render();
  });
  els.hideDone.addEventListener("change", function () {
    hideDone = els.hideDone.checked;
    render();
    save();
  });
  els.showCards.addEventListener("change", function () {
    showCards = els.showCards.checked;
    save();
  });
  els.search.addEventListener("input", function () {
    query = els.search.value.trim();
    renderShelf();
  });
  els.achGrid.addEventListener("click", function (ev) {
    var b = ev.target.closest(".ach");
    if (!b) return;
    var id = b.getAttribute("data-ach");
    achSel = achSel === id ? null : id;
    sfx("tab");
    renderAch();
    restoreFocus('.ach[data-ach="' + id + '"]');
  });
  els.slotA.addEventListener("click", function () { removeSlot(0); });
  els.slotB.addEventListener("click", function () { removeSlot(1); });
  $("clearBtn").addEventListener("click", clearBench);
  els.hintBtn.addEventListener("click", giveHint);
  els.soundBtn.addEventListener("click", function () {
    soundOn = !soundOn;
    if (!soundOn && actx && actx.state === "running") { try { quiet(actx.suspend()); } catch (e) { /* 무시 */ } }
    sfx("pick");
    renderHeader();
    save();
  });
  $("rOk").addEventListener("click", closeReveal);
  $("rOk").addEventListener("keydown", function (ev) { if (ev.repeat) ev.preventDefault(); });
  els.reveal.addEventListener("click", function (ev) { if (ev.target === els.reveal) closeReveal(); });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Tab" && !els.reveal.hidden) { ev.preventDefault(); $("rOk").focus(); return; }
    if (ev.key !== "Escape" || ev.repeat) return;
    if (!els.reveal.hidden) closeReveal();
    else if (!els.resetConfirm.hidden) hideConfirm();
    else if (query && document.activeElement === els.search) { els.search.value = ""; query = ""; renderShelf(); }
  });
  els.resetBtn.addEventListener("click", function () { els.resetConfirm.hidden = false; $("resetNo").focus(); });
  $("resetNo").addEventListener("click", hideConfirm);
  $("resetYes").addEventListener("click", function () {
    resetState();
    achSel = null;
    els.search.value = "";
    query = "";
    save();
    setMsg("새로운 세상이 시작됐어요. 원소 두 개를 차례로 눌러 섞어보세요.");
    render();
    hideConfirm();
  });

  /* ---------- 시작 ---------- */
  var started = false;
  function start(data) {
    if (started) return;
    started = true;
    try {
      if (data && Array.isArray(data.found)) apply(data); else load();
    } catch (e) { resetState(); }
    if (allFound()) {
      setMsg("모든 원소를 발견했어요! 새로 시작하려면 아래쪽의 \"처음부터 다시\"를 누르세요.", true);
    } else if (log.length) {
      setMsg("다시 오셨네요. 이어서 창조해 볼까요?");
    } else {
      setMsg("원소 두 개를 차례로 눌러 섞어보세요. 예를 들면 <b>불</b>과 <b>물</b>.");
    }
    render();
  }
  var hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === "function") { try { hot.snapshot(serialize); } catch (e) { /* 무시 */ } }
  if (hot && typeof hot.ready === "function") {
    try { hot.ready(start); } catch (e) { /* 아래에서 직접 시작 */ }
    setTimeout(function () { start(hot.data || {}); }, 1500);
  } else {
    start((hot && hot.data) || {});
  }
})();
</script>
</body>
</html>
